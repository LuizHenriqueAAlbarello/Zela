spring.application.name=zela-api

# Porta: o Render injeta PORT; localmente usa 8080
server.port=${PORT:8080}
# Para o Location sair com https atrás do proxy do Render
server.forward-headers-strategy=framework

# Banco Oracle FIAP: NUNCA colocar usuário/senha aqui. Tudo vem de variáveis de ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
# Não derruba a aplicação na subida se o banco demorar a responder
spring.datasource.hikari.initialization-fail-timeout=-1

# Erros nunca devolvem stack trace nem detalhes internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# CORS: lista separada por vírgula. Padrão libera qualquer origem (front local ou publicado)
zela.cors.allowed-origins=${CORS_ORIGINS:*}

spring.jackson.default-property-inclusion=always
